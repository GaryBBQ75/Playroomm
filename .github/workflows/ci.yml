name: Tests Playroom
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: playroom
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: playroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U playroom -d playroom_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://playroom:test_password@127.0.0.1:5432/playroom_test
      COOKIE_SECURE: "false"
      REQUIRE_DATABASE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: POSTGRES_PASSWORD=test_password APP_ORIGIN=https://playroom.example.com docker compose -f compose.yaml config --quiet
      - run: docker build -t playroom-test .
